name: Release

# Cut a release: git tag vX.Y.Z && git push --tags
#
# Publishes a GitHub Release for the tag with a prebuilt ui-dist.tar.gz asset
# attached, so openflight-update never needs to run `npm ci`/`npm run build`
# on a Raspberry Pi. Tags are expected to be pushed against commits already
# on main that passed pytest.yml/pylint.yml/ui-build.yml, so this workflow
# does not re-run the full test suite.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify tag matches pyproject.toml version
        run: |
          version=$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          expected="v${version}"
          if [ "${GITHUB_REF_NAME}" != "$expected" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match pyproject.toml version ($expected)"
            exit 1
          fi

  build-ui:
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: ui
      - name: Build
        run: npm run build
        working-directory: ui
      - name: Package ui-dist.tar.gz
        # Top-level `dist/` entry, matching openflight.update.deploy.install_ui's
        # expected layout (unpacked into <release>/ui/, producing ui/dist/...).
        run: tar -czf ui-dist.tar.gz -C ui dist
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ui-dist
          path: ui-dist.tar.gz
          retention-days: 1

  release:
    needs: build-ui
    runs-on: ubuntu-latest
    steps:
      - name: Download ui-dist artifact
        uses: actions/download-artifact@v7
        with:
          name: ui-dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            ui-dist.tar.gz
