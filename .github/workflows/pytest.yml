name: Tests

on:
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyserial flask flask-socketio flask-cors numpy opencv-python supervision
          pip install trackers@git+https://github.com/roboflow/trackers.git
          pip install -e .
      - name: Run tests
        run: |
          pytest tests/ -v --tb=short

  lock:
    name: uv.lock is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
      - name: Check the lockfile matches pyproject.toml
        run: uv lock --check
