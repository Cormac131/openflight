name: Experimental release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build the artifact and print the Discord payload without publishing
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-experimental
  cancel-in-progress: true

jobs:
  tests:
    uses: ./.github/workflows/pytest.yml

  ui:
    uses: ./.github/workflows/ui-build.yml
    with:
      upload-dist: true

  release:
    needs: [tests, ui]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      DRY_RUN: ${{ inputs.dry_run || 'false' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked

      - name: Resolve the experimental tag
        id: meta
        run: |
          base="$(uv run python -c 'import openflight; print(openflight.__version__)')"
          if git rev-parse -q --verify "refs/tags/v${base}" >/dev/null; then
            echo "::error::v${base} is already released; merge a bump first: uv run python scripts/release/prepare_release.py next <X.Y.Z>"
            exit 1
          fi
          tag="v${base}-dev.$(git rev-list --count HEAD)"
          state="$(gh release list --limit 100 --json tagName,isDraft --jq ".[] | select(.tagName==\"$tag\") | .isDraft")"
          if [ "$state" = "false" ]; then
            echo "::notice::$tag is already published; nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          elif [ "$state" = "true" ]; then
            gh release delete "$tag" --yes
          fi
          prev="$(gh release list --limit 100 --json tagName,isPrerelease,isDraft \
                  --jq '[.[] | select(.isPrerelease and (.isDraft|not) and (.tagName|test("-dev\\.")))][0].tagName // empty')"
          printf 'skip=false\ntag=%s\nprev=%s\n' "$tag" "$prev" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v7
        if: steps.meta.outputs.skip != 'true'
        with:
          name: ui-dist
          path: ui/dist

      - name: Build the artifact
        if: steps.meta.outputs.skip != 'true'
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          uv run python scripts/release/build_artifact.py \
            --tag "$TAG" --channel experimental --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA" --output dist/release
      - uses: actions/upload-artifact@v7
        if: steps.meta.outputs.skip != 'true'
        with:
          name: release-${{ steps.meta.outputs.tag }}
          path: dist/release

      - name: Publish the pre-release
        id: publish
        if: steps.meta.outputs.skip != 'true' && env.DRY_RUN != 'true'
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          PREV: ${{ steps.meta.outputs.prev }}
        run: |
          gh release create "$TAG" dist/release/* --draft --prerelease --target "$GITHUB_SHA" \
            --title "$TAG" --generate-notes ${PREV:+--notes-start-tag "$PREV"}
          gh release edit "$TAG" --draft=false
          gh release view "$TAG" --json body --jq .body > dist/notes.md

      - name: Prune older experimental releases
        if: steps.publish.outcome == 'success'
        continue-on-error: true
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          KEEP: "10"
        run: |
          gh release list --limit 200 --json tagName,isPrerelease,isDraft,createdAt \
            --jq "[.[] | select(.tagName|test(\"-dev\\\\.\"))] | sort_by(.createdAt) | reverse
                  | (map(select(.isDraft)) + (map(select(.isDraft|not)) | .[$KEEP:])) | .[].tagName" \
          | while read -r old; do
              [ "$old" = "$TAG" ] && continue
              gh release delete "$old" --cleanup-tag --yes || echo "::warning::could not prune $old"
            done

      - name: Build the Discord payload
        if: steps.meta.outputs.skip != 'true'
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          [ -f dist/notes.md ] || printf 'Dry run: release notes are generated at publish time.\n' > dist/notes.md
          uv run python scripts/release/discord_payload.py \
            --title "OpenFlight $TAG" --channel experimental \
            --artifact "openflight-$TAG.tar.gz" \
            --release-url "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" \
            --notes-file dist/notes.md --output dist/discord.json

      - name: Announce on Discord
        if: steps.meta.outputs.skip != 'true' && (steps.publish.outcome == 'success' || env.DRY_RUN == 'true')
        continue-on-error: true
        uses: ./.github/actions/announce-discord
        with:
          webhook-url: ${{ secrets.DISCORD_EXPERIMENTAL_WEBHOOK_URL }}
          source: DISCORD_EXPERIMENTAL_WEBHOOK_URL
          payload-file: dist/discord.json
          dry-run: ${{ env.DRY_RUN }}
