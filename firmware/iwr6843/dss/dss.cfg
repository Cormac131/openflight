/*
 *  OpenFlight on-chip solve -- SYS/BIOS (RTSC) configuration, DSS/C674x.
 *
 *  Milestone 1 (Task 2 of the on-chip solve plan): a minimal BIOS image that
 *  boots alongside the existing MSS image, proving the three-image
 *  meta-image build/link plumbing before any solve code is ported onto the
 *  DSP. Adapted from the mmWave SDK 3.6 mem_capture DSS test config
 *  (ti/drivers/test/mem_capture/xwr68xx/dss.cfg), trimmed to what a task
 *  scheduler + one L2 heap needs.
 */
environment['xdc.cfg.check.fatal'] = 'false';

/********************************************************************
 ************************** BIOS Modules ****************************
 ********************************************************************/
var Memory    = xdc.useModule('xdc.runtime.Memory');
var BIOS      = xdc.useModule('ti.sysbios.BIOS');
var ECM       = xdc.useModule('ti.sysbios.family.c64p.EventCombiner');
var HeapMem   = xdc.useModule('ti.sysbios.heaps.HeapMem');
var HeapBuf   = xdc.useModule('ti.sysbios.heaps.HeapBuf');
var Task      = xdc.useModule('ti.sysbios.knl.Task');
var Idle      = xdc.useModule('ti.sysbios.knl.Idle');
var SEM       = xdc.useModule('ti.sysbios.knl.Semaphore');
var Event     = xdc.useModule('ti.sysbios.knl.Event');
var Hwi       = xdc.useModule('ti.sysbios.family.c64p.Hwi');
var System    = xdc.useModule('xdc.runtime.System');
var SysStd    = xdc.useModule('xdc.runtime.SysStd');
System.SupportProxy = SysStd;

/*
 * Enable Event Groups here; registering an ISR for a specific GEM INTC is
 * done with EventCombiner_dispatchPlug()/Hwi_eventMap() (Task 6+). Without
 * this the osal HwiP_tirtos shim (pulled in by C674_COMMON_STD_LIB) leaves
 * ti_sysbios_family_c64p_EventCombiner_{disableEvent,dispatchPlug} unresolved
 * at link time, since nothing else in a Milestone-1 image references the
 * EventCombiner module to pull its implementation into the custom BIOS lib.
 */
ECM.eventGroupHwiNum[0] = 7;
ECM.eventGroupHwiNum[1] = 8;
ECM.eventGroupHwiNum[2] = 9;
ECM.eventGroupHwiNum[3] = 10;

/*
 * L2 SRAM/cache split (memory decision 22: the DSS reserves no resident L3
 * buffer -- it reads the capture arena in place from L3 and caches it in
 * L2). On the ti.platforms.c6x platform (used here), the Cache module
 * refuses to take sizes from Cache.initSize in a cfg script ("Cache settings
 * cannot be changed in user configuration when using the ti.platforms.c6x
 * platform. Please update the cache size symbols in the linker cmd file to
 * change the L1/L2 cache sizes." -- ti.sysbios.family.c64p.Cache.xs:403), so
 * the split is set where that message says to: as linker symbols in
 * dss_linker.cmd, which override the ALL-SRAM (l2Size=0) default baked into
 * the platform's c674x_linker.cmd.
 *
 * Starting split, per the Task 2 brief: 32 KB of L2 as cache over L3 (so the
 * DSS can read the capture arena without a manual copy), the remaining L2
 * as SRAM for .text/.const/.bss/.data/.stack and the .solveScratch section.
 * Task 4 measures whether 32 KB is enough working set for the solve and
 * adjusts this if not.
 */

/* Default Heap Creation: Local L2 memory */
var heapMemParams           = new HeapMem.Params();
heapMemParams.size          = 32*1024;
heapMemParams.sectionName   = "systemHeap";
Program.global.heap0        = HeapMem.create(heapMemParams);
Memory.defaultHeapInstance  = Program.global.heap0;

/* Enable BIOS Task Scheduler */
BIOS.taskEnabled           = true;

/* Keep enum layout consistent with the MSS/R4F image (mss.cfg) so any enum
 * that later crosses the mailbox IPC boundary has the same size on both
 * sides. solve_ipc.h currently uses only fixed-width ints/floats and plain
 * #define status codes for exactly this reason, but this keeps the two
 * images matched at the BIOS level regardless. */
BIOS.includeXdcRuntime  = true;
BIOS.libType            = BIOS.LibType_Custom;
BIOS.customCCOpts      += " --enum_type=int ";
