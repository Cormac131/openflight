% EXPERIMENTAL profile: narrows the pre-impact range window from 53 bins to
% 32 bins to free enough L3 for a 54-frame, 108 ms movie (8 pre, 10 impact,
% 36 ball), 3 TX, 12 loops, IQ8 storage. Stride stays 1. Impact and ball
% windows stay at the full 53 bins; only the pre-impact phase narrows.
%
% The pre-impact frames feed the on-chip leave detector. Narrowing that
% window reduces the detector's range coverage, which can degrade trigger
% reliability even though it does not touch measurement accuracy. This is
% the only profile in this project that carries that risk, which is why it
% is opt-in.
%
% DO NOT make this the default. It must not be promoted until a range
% session with at least 40 shots confirms its trigger rate is comparable to
% the 51-frame profile (config/iwr6843_l3dump_dense_51f2ms_53bin_iq8.cfg).
% As of this commit, no such session has been run.
dfeDataOutputMode 1
channelCfg 15 7 0
adcCfg 2 1
profileCfg 0 60.0 7 3 38 0 0 100 1 128 4000 0 0 30
chirpCfg 0 0 0 0 0 0 0 1
chirpCfg 1 1 0 0 0 0 0 2
chirpCfg 2 2 0 0 0 0 0 4
frameCfg 0 2 12 0 2 1 0
captureFormat iq8
iq8Scale 128
phaseCaptureCfg 20 32 8 32 53 10 47 53 64 36 1
lowPower 0 0
sensorStart
