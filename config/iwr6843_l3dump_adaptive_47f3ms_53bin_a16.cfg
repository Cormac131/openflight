% Adaptive IQ16 (default kiosk / live-script profile): the wide profile's
% 53-bin processing windows at full IQ16 precision for the detect task, with
% L3 holding only the bins the retention policy (l3_retain.c) places around
% the club, the impact and the ball: 16 pre, 24 impact and 16 post bins per
% frame. The smaller slots buy a longer movie: 24 pre frames (72 ms of
% approach), 7 impact frames and 16 ball frames at 3 ms, 47 frames in all,
% from the same L3 that held 24 wide IQ16 frames. Needs firmware with the
% compact formats (captureFormat adaptive16); older firmware answers "Error"
% to captureFormat and the config is refused before sensorStart.
dfeDataOutputMode 1
channelCfg 15 7 0
adcCfg 2 1
profileCfg 0 60.0 7 3 38 0 0 100 1 128 4000 0 0 30
chirpCfg 0 0 0 0 0 0 0 1
chirpCfg 1 1 0 0 0 0 0 2
chirpCfg 2 2 0 0 0 0 0 4
frameCfg 0 2 12 0 3 1 0
captureFormat adaptive16
captureCfg retain 16 24 16
phaseCaptureCfg 20 53 24 32 53 7 47 53 47 16 1
lowPower 0 0
sensorStart
