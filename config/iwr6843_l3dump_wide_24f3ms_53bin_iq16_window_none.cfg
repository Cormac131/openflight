% A/B of the range-FFT window (2026-10-01): identical to
% iwr6843_l3dump_wide_24f3ms_53bin_iq16.cfg except 'captureCfg window none'.
% The window persists on the board until power-off or another 'captureCfg
% window', so alternate between the _hann and _none profiles. Needs firmware
% with l3_window (dumps record it: dump version 10, meta['range_window']).
dfeDataOutputMode 1
channelCfg 15 7 0
adcCfg 2 1
profileCfg 0 60.0 7 3 38 0 0 100 1 128 4000 0 0 30
chirpCfg 0 0 0 0 0 0 0 1
chirpCfg 1 1 0 0 0 0 0 2
chirpCfg 2 2 0 0 0 0 0 4
frameCfg 0 2 12 0 3 1 0
captureFormat iq16
captureCfg window none
phaseCaptureCfg 20 53 9 32 53 7 47 53 47 8 1
lowPower 0 0
sensorStart
