# ─────────────────────────────────────────────────────────────────────
#  OpenFlight configuration
# ─────────────────────────────────────────────────────────────────────
#
#  This file lives on the SD card's boot partition, which any computer can
#  read. Put the card in your laptop, edit this file, put it back in the
#  launch monitor, and switch it on — that is the whole process.
#
#  You do NOT need to set anything here to get started. OpenFlight finds
#  the radars and sensors you have plugged in on its own. The settings
#  below are the handful of things it cannot measure for itself.
#
#  Rules: one SETTING=value per line, no spaces around the "=". Anything
#  after a "#" is ignored. Remove the "#" at the start of a line to turn
#  that setting on.
#
# ─────────────────────────────────────────────────────────────────────
#  Wi-Fi and login
# ─────────────────────────────────────────────────────────────────────
#
#  Set these with the Raspberry Pi Imager's settings screen when you write
#  the card, not here. Imager handles the Wi-Fi password and the user
#  account, and does it more safely than a plain-text file can.
#
# ─────────────────────────────────────────────────────────────────────
#  Where you are hitting from
# ─────────────────────────────────────────────────────────────────────

#  A name for this location. It is written into every session log, which
#  makes it easy to tell your garage sessions from your range sessions.
#SESSION_LOCATION=garage

#  Distance from the launch monitor to your net or screen, in metres.
#  Used to work out where the ball would have been at the screen.
#NET_DISTANCE=3.0

#  The OPS243-A is normally on USB. Set this only if yours is wired to the
#  Pi's GPIO UART instead. /dev/ttyAMA0 exists on every Pi with UART on, so
#  OpenFlight will not guess that a radar is there.
#OPS243_UART=false

# ─────────────────────────────────────────────────────────────────────
#  60 GHz radar (IWR6843) — optional
# ─────────────────────────────────────────────────────────────────────
#
#  Detected automatically. These override the built-in distances only if
#  your setup differs from the standard build.

#  Distance from the radar to the ball, in metres (default 1.575).
#IWR6843_TEE_M=1.575

#  Distance from the radar to the net, in metres (default 4.6).
#IWR6843_NET_M=4.6

# ─────────────────────────────────────────────────────────────────────
#  K-LD7 angle radars — older builds only
# ─────────────────────────────────────────────────────────────────────
#
#  These have been replaced by the 60 GHz radar above. If your build has
#  them, they stay switched OFF until you set the mount tilt: OpenFlight
#  will not guess it, because a wrong tilt quietly skews every launch
#  angle reading rather than showing an obvious error.
#
#  Measure the tilt of the radar's face with a phone spirit-level app.

#KLD7_MOUNT_TILT=12.5
#KLD7_ANGLE_OFFSET=1.5

# ─────────────────────────────────────────────────────────────────────
#  Golf simulator software
# ─────────────────────────────────────────────────────────────────────
#
#  Sends your shots to GSPro, E6 Connect, and similar. Set this to true,
#  then put your simulator's address in config/sim.json on the Pi.
#OPENFLIGHT_ENABLE_SIM=false
